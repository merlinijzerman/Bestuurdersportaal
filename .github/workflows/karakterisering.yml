name: karakterisering

# ============================================================================
#  W1 — Karakteriseringsharnas (issue #88, EPIC W / deploy 2 "de naad").
# ----------------------------------------------------------------------------
#  Draait de snapshot-suite (`tests/karakterisering/run.mjs --verify`) tegen een
#  EPHEMERE Supabase-CLI-stack + `next start`. Elk byte-verschil t.o.v. de
#  gecommitte snapshots → non-zero exit → deze job faalt. Zo wordt de deploy-2-
#  codemod ("nul verschil") een test i.p.v. een bewering.
#
#  GATE-STATUS STAAT NIET IN DIT BESTAND (W4, #96). Of deze job blokkeert is
#  uitsluitend te lezen uit de branch-protection-regel op `main`:
#      gh api repos/:owner/:repo/branches/main/protection \
#        --jq '.required_status_checks.contexts[]'
#  Een comment kan dat niet weten, en op 21-08-2026 hadden drie van de vier
#  gate-uitspraken in deze map het mis — alle drie onderschattend. Zet die
#  bewering hier dus niet terug; corrigeren lost één geval op, weglaten lost de
#  categorie op.
#
#  Wat WEL hier hoort: de job-`name` hieronder is de gepinde check-naam.
#  Hernoem hem niet zonder de branch-protection-regel mee te verzetten — dan
#  wordt de gate stil losgekoppeld én blijft elke PR hangen op een check die
#  nooit meldt.
#
#  DRIE VERIFY-RONDES, TIJDELIJK (W4 §4, #96). `--verify` draait hieronder 3×
#  achter elkaar in plaats van 1×. Die twee meten verschillende dingen:
#
#    ronde 1  bewijst dat de snapshots niet op opgebouwde staat leunen — de DB
#             is per run vers, dus wat hier slaagt is reproduceerbaar vanaf nul;
#    ronde 2+ bewijzen dat een scenario HERHAALBAAR is. Deploy 2 voegt ~200
#             scenario's toe die echt muteren; een preseed die de fixture niet
#             vers zet valt pas op bij de tweede ronde. Eén groene run zegt daar
#             niets over.
#
#  BESLUIT: bedoeld als maatregel VOOR DE DUUR VAN DEPLOY 2. De voorwaarde is
#  NIET dat iemand er last van heeft, maar dat W5 klaar is en de muterende
#  scenario's stabiel zijn gebleken.
#
#  STAND 21-08-2026: W5 is gemerged (#101/#104) — 95 van de 116 routes door de
#  wrapper, 361 scenario's, `--verify` 3x groen, ook op een van nul herbouwde
#  database en in CI. De eerste helft van de voorwaarde is dus vervuld. De tweede
#  niet: deploy 2 is wél gemerged maar nog niet UITGEROLD, en dat is precies de
#  periode waarin ronde 2 en 3 hun werk moeten doen. Blijft staan tot na de
#  uitrol; dán is dit een echte keuze in plaats van een aanname.
#
#  Wie het terugdraait: haal de lus weg en zet er een verwijzing naar dit besluit
#  voor in de plaats, niet stilzwijgend — anders verdwijnt de
#  herhaalbaarheidscontrole zonder spoor.
#
#  LET OP, de eerste versie van deze notitie zei "met een 3×-ronde in
#  `nightly-fidelity`". DAT KAN NIET. Die workflow draait
#  `scripts/cross-tenant-ci.sh` tegen een gehoste test-DB; hij bouwt de app niet,
#  start geen server en kent het harnas niet. De 3× daarheen verplaatsen betekent
#  een NIEUWE job die een stack boot en `next build` draait — dat is deze workflow
#  dupliceren, geen kleine verhuizing. Wie de 3× hier weghaalt zonder die job te
#  bouwen, haalt de controle wég in plaats van hem te verplaatsen.
#
#  Weeg het tegen de GEMETEN kosten, niet tegen de aanname — en meet opnieuw, want
#  de verhouding beweegt met het aantal scenario's:
#
#      131 scenario's (21-08, tijdens W4)   verify 3× 27s van 3m42s -> 1× scheelt ~6%
#      335 scenario's (21-08, na W4)        verify 3× 41s van 3m35s -> 1× scheelt ~11%
#      361 scenario's (21-08, na W5)        zie hieronder               -> ~12%
#
#  Meting na W5, run 32512844760, job 231s in totaal:
#
#      stack boot 76s | next build 51s | npm ci 14s | schema 10s | stack stop 18s
#      "app starten + snapshots 3x verifiëren"  48s
#
#  LET OP bij het lezen van dat laatste getal: die STAP meet de server-start én de
#  drie rondes samen. Twee extra rondes kosten daarvan grofweg 29s — circa 12% van
#  de job — maar dat is afgeleid, niet gemeten. Wil je het besluit op een gemeten
#  getal baseren, splits die stap dan eerst in twee stappen; dat is goedkoper dan
#  je vergissen in de richting van "weghalen scheelt veel".
#
#  De job wordt nog steeds gedomineerd door de Supabase-stack en `next build`,
#  niet door de suite. Geen factor 3, maar de winst groeit mee met het aantal
#  scenario's. Meet vóór het besluit en zet het gemeten getal hier neer, in plaats
#  van dit rijtje te laten verouderen.
#
#  Nooit tegen productie: uitsluitend de wegwerp-CLI-DB; de seed is idempotent.
# ============================================================================
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karakterisering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karakterisering:
    name: Karakterisering (snapshot-verschil = rood)
    runs-on: ubuntu-latest
    env:
      # App-secrets die het gekarakteriseerde pad niet raken: dummies zodat
      # `next build` + boot slagen. De HMAC-sleutel is een dummy; de
      # Anthropic-sleutel ook — sinds #311 bereikt het SSE-pad de provider wél,
      # maar uitsluitend de lokale WP4-stub hieronder (dubbel gegrendeld in
      # core/lib/ai-provider-endpoint.mjs: SEED_DOELOMGEVING=local én de lokale
      # Supabase-URL). Er gaat nooit iets naar api.anthropic.com.
      #
      # GEEN AI_MODEL-override meer: de code-default (claude-opus-4-8) staat op de
      # DB-allowlist; een afwijkende modelstring zou de poort fail-closed laten
      # sluiten en de SSE-snapshots in CI een 503 laten zien waar lokaal een
      # 200 staat. Het model bereikt toch alleen de stub.
      AUDIT_HMAC_SLEUTEL: "0123456789abcdef0123456789abcdef"
      AUDIT_HMAC_SLEUTEL_VERSIE: "v1"
      ANTHROPIC_API_KEY: "sk-ant-dummy-not-used"
      NEXT_PUBLIC_FONDS_NAAM: "Testfonds W1"
      DEPLOY_TARGET: "app"
      APP_BASE_URL: "http://127.0.0.1:3000"
      SEED_DOELOMGEVING: "local"
      # #311 — SSE-karakterisering via de lokale providerstub (patroon e2e-security.yml).
      WP4_E2E_AI_PROVIDER: "local"
      WP4_E2E_AI_PROVIDER_URL: "http://127.0.0.1:8790"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node opzetten
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Dependencies installeren
        run: npm ci

      - name: Projectref-grendel verifiëren (geen database)
        run: npm run test:seed-guard

      # W8 (#175) — puur, geen DB/build nodig, dus VÓÓR de dure stack-boot zodat een
      # te streng conceptschema meteen faalt. De classifier bewijst differentieel dat
      # geen gegenereerd schema strenger is dan de code (corpus = de harnas-bodies) en
      # dat een bewust te streng schema ROOD wordt (negatieve controle). Exit ≠ 0 → rood.
      - name: W8 — schema niet-strenger (differentiële classifier)
        run: npm run test:schema-niet-strenger

      # Pin op dezelfde CLI als de rls-cross-tenant-baseline (db.major_version=17).
      - name: Supabase CLI opzetten
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Ephemere Supabase-stack starten (Postgres + auth + storage)
        run: bash scripts/start-ephemeral-supabase.sh

      # De CLI-demo-keys van deze verse stack; NEXT_PUBLIC_* moeten vóór de build
      # in de omgeving staan (worden geïnlined).
      - name: Stack-keys in de omgeving zetten
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Schema opbouwen (baseline + post-cutoff-migraties)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/testdb-apply-migrations.sh

      - name: App bouwen
        run: npm run build

      # #311 — deterministische Anthropic-compatibele stub; bewaart nooit
      # promptinhoud (alleen tellers en hashes, zie ai-provider-stub.test.mjs).
      - name: Lokale AI-providerstub starten
        run: |
          node tests/e2e/fixtures/ai-provider-stub.mjs > "$RUNNER_TEMP/karakterisering-ai-provider.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8790/health >/dev/null && exit 0
            sleep 1
          done
          echo "FOUT: AI-providerstub kwam niet op." >&2
          exit 1

      # Twee passes op ÉÉN gedeelde stack en ÉÉN build (de dure delen). De vlag
      # wordt per Next-proces gelezen (env bij processtart), dus flag-uit en
      # flag-aan zijn twee `next start`-processen — geen tweede build, geen tweede
      # Supabase. Runtime van beide wordt geëcho'd zodat de kosten zichtbaar zijn.
      - name: App starten + snapshots 3x verifiëren (vlag UIT)
        run: |
          wacht_op_boot() {
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:3000/api/healthz/ping >/dev/null && return 0
              sleep 1
            done
            echo "FOUT: next start kwam niet op binnen 60s." >&2
            return 1
          }
          t0=$(date +%s)
          PORT=3000 npm run start &
          SERVER=$!
          if ! wacht_op_boot; then kill "$SERVER" 2>/dev/null || true; exit 1; fi
          # 3x achter elkaar — zie de BESLUIT-notitie in de kop. Ronde 1 dekt
          # "geen opgebouwde staat", ronde 2 en 3 dekken herhaalbaarheid.
          code=0
          for ronde in 1 2 3; do
            echo "::group::karakterisering --verify ronde $ronde/3 (vlag UIT)"
            if ! node tests/karakterisering/run.mjs --verify; then
              echo "::endgroup::"; echo "FOUT: --verify rood in ronde $ronde van 3." >&2
              code=1; break
            fi
            echo "::endgroup::"
          done
          kill "$SERVER" 2>/dev/null || true
          wait "$SERVER" 2>/dev/null || true
          echo "vlag-uit-pass: $(( $(date +%s) - t0 ))s"
          exit $code

      # W7 (#153): dezelfde stack, dezelfde build, tweede Next-proces mét de vlag —
      # op een EIGEN poort (3001). De vlag-uit-server hierboven wordt via `npm run
      # start` gestart, dat `next-server` als kind spawnt; `kill` op de npm-wrapper
      # laat dat kind mogelijk op poort 3000 staan. Een aparte poort vermijdt die
      # kill-timing-race volledig: bindt de vlag-aan-server elders, dan is een
      # EADDRINUSE geen stille terugval op de vlag-UIT-server (die zou de twee
      # verwachte 403's als 400/404 teruggeven en het contract vals-rood maken).
      - name: Autorisatiecontract afdwingen (vlag AAN)
        env:
          ENFORCE_CAPABILITY: "on"
          APP_BASE_URL: "http://127.0.0.1:3001"
        run: |
          t0=$(date +%s)
          ENFORCE_CAPABILITY=on PORT=3001 npm run start &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3001/api/healthz/ping >/dev/null && ok=1 && break
            sleep 1
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "FOUT: next start (vlag aan) kwam niet op binnen 60s." >&2
            kill "$SERVER" 2>/dev/null || true; exit 1
          fi
          echo "::group::karakterisering --authz (vlag AAN)"
          node tests/karakterisering/run.mjs --authz
          code=$?
          echo "::endgroup::"
          kill "$SERVER" 2>/dev/null || true
          wait "$SERVER" 2>/dev/null || true
          echo "vlag-aan-pass: $(( $(date +%s) - t0 ))s"
          exit $code

      # W9 (#176): derde Next-proces op een EIGEN poort (3002), mét ENFORCE_SCHEMA=on.
      # Zelfde reden voor de aparte poort als bij de vlag-aan-server hierboven: geen
      # kill-timing-race met de andere processen. Bewijst twee dingen tegen de server:
      #   Deel 1  geen over-strengheid — elk corpus-scenario houdt zijn vlag-uit-status
      #           (de losse schema's breken geen geldig verkeer);
      #   Deel 2  de handhaving vuurt — geauthenticeerde kapotte JSON naar elk van de 7
      #           gesanctioneerde slikkers geeft 400 (empirische §7-bevestiging).
      # ENFORCE_CAPABILITY blijft hier UIT, anders zouden capability-403's Deel 1 kleuren.
      - name: Schemahandhaving afdwingen (ENFORCE_SCHEMA aan)
        env:
          ENFORCE_SCHEMA: "on"
          APP_BASE_URL: "http://127.0.0.1:3002"
        run: |
          t0=$(date +%s)
          ENFORCE_SCHEMA=on PORT=3002 npm run start &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3002/api/healthz/ping >/dev/null && ok=1 && break
            sleep 1
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "FOUT: next start (schema aan) kwam niet op binnen 60s." >&2
            kill "$SERVER" 2>/dev/null || true; exit 1
          fi
          echo "::group::karakterisering --schema (vlag AAN)"
          node tests/karakterisering/run.mjs --schema
          code=$?
          echo "::endgroup::"
          kill "$SERVER" 2>/dev/null || true
          wait "$SERVER" 2>/dev/null || true
          echo "schema-pass: $(( $(date +%s) - t0 ))s"
          exit $code

      - name: Supabase-stack stoppen
        if: always()
        run: supabase stop || true
