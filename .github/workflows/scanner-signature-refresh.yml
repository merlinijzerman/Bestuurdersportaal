name: scanner-signature-refresh

# De scannerimage bevat de ClamAV-signatures. Git-deploys staan bewust uit in
# scanner/vercel.json; zonder deze expliciete hook zou de signatureset stil
# verouderen. GitHub Actions-crons lopen vanaf de default branch en roepen de
# hook aan die in Vercel expliciet aan branch `preview` is gekoppeld.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scanner-signature-refresh
  cancel-in-progress: false

jobs:
  refresh-preview:
    name: Scanner-signatures Preview verversen
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Hook aanroepen zonder buildcache
        env:
          VERCEL_SCANNER_PREVIEW_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_SCANNER_PREVIEW_DEPLOY_HOOK_URL }}
        run: |
          set -Eeuo pipefail
          test -n "${VERCEL_SCANNER_PREVIEW_DEPLOY_HOOK_URL:-}" || {
            echo "Secret VERCEL_SCANNER_PREVIEW_DEPLOY_HOOK_URL ontbreekt" >&2
            exit 1
          }
          curl --fail --silent --show-error --retry 2 --request POST \
            "${VERCEL_SCANNER_PREVIEW_DEPLOY_HOOK_URL}?buildCache=false"
