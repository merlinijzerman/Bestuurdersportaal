name: rls-cross-tenant

# ============================================================================
#  §15 cross-tenant testsuite (increment T5, besluit 0046).
# ----------------------------------------------------------------------------
#  Draait de volledige §15-matrix (T1–T14) tegen een EPHEMERE Supabase-DB
#  (optie A): de CLI boot Postgres + auth + storage, scripts/cross-tenant-ci.sh
#  past de migraties toe en draait de app-laag (node:test) én de DB-laag (psql:
#  T3/T4/T6/T7). Elke overtreding → non-zero exit → deze job faalt.
#
#  Activering (fasering, besluit 0046 → geëffectueerd in T7/besluit 0049): de
#  suite draait op ELKE push én pull_request. Blokkerend maken = één repo-admin-
#  handeling: zet branch protection op `main` met deze job als REQUIRED STATUS
#  CHECK. De check-naam is bewust gepind (job `name:` hieronder) zodat hij
#  stabiel te selecteren is: "Cross-tenant isolatie (§15 T1-T14)". Stappen +
#  motivering staan in `G2-GO-NO-GO-CONTROLEKADER.md` (repo-root) en de
#  go/no-go-checklist B9. Het AANZETTEN blijft een admin-handeling (Claude Code
#  bereidt voor + documenteert); de directe-push-flow naar main blijft geldig
#  zolang er feitelijk één tenant is (Horizon-demo), tot net vóór PGB live.
#
#  XTENANT_REQUIRE_DB=1 gaat NIET over merge-blokkade maar over test-integriteit
#  BINNEN deze job: in CI staat de DB er altijd (supabase start), dus een
#  ontbrekende DB duidt op een defect en hoort de job rood te maken (geen stille
#  skip van de DB-laag).
#
#  Nooit tegen productie: de suite draait uitsluitend tegen de wegwerp-CLI-DB;
#  de gedrag-suites seeden en rollen terug (begin … rollback).
# ============================================================================
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-cross-tenant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-tenant:
    # Gepinde check-naam voor branch protection "required status check" (B9/T7).
    # Wijzig deze naam NIET zonder de branch-protection-regel mee te verzetten,
    # anders wordt de gate stil losgekoppeld.
    name: Cross-tenant isolatie (§15 T1-T14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Dependencies installeren
        run: npm ci

      # Pin op dezelfde CLI waarmee de Preview-baseline is geëxporteerd en de
      # lokale PG17-replay is bewezen. Zonder expliciete input leidde de action
      # in CI ten onrechte 2.20.3 af uit het lockfile; die versie kent
      # db.major_version=17 nog niet.
      - name: Supabase CLI opzetten
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Ephemere Supabase-stack starten (Postgres + auth + storage)
        # Nieuwere CLI-versies passen migrations/* automatisch toe tijdens
        # `start`. Deze repo gebruikt daarna bewust zijn eigen baselinevolgorde;
        # de wrapper houdt de historische map daarom alleen tijdens boot buiten
        # beeld en zet haar via een trap altijd terug.
        run: bash scripts/start-ephemeral-supabase.sh

      - name: Volledige §15 cross-tenant suite (app-laag + DB-laag)
        env:
          # De lokale CLI-DB (config.toml → [db] port 54322). Wegwerpbaar.
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # Test-integriteit (geen merge-blokkade): in CI is de DB er altijd,
          # dus een ontbrekende DB → rood (geen stille skip van de DB-laag).
          XTENANT_REQUIRE_DB: "1"
        run: bash scripts/cross-tenant-ci.sh

      - name: Supabase-stack stoppen
        if: always()
        run: supabase stop || true
