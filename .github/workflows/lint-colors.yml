name: lint-colors

# Kleur-borging: faalt zodra er hardcoded merk-hex of gemigreerde
# Tailwind-palette-classes insluipen. Draait op elke push/PR.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-brand-hex.mjs
