name: nightly-fidelity

# ============================================================================
#  §15 cross-tenant suite — nightly FIDELITEIT (optie B, besluiten 0046/0194).
# ----------------------------------------------------------------------------
#  Fidelity-vangnet naast de ephemere CI-run (rls-cross-tenant.yml, optie A).
#  Draait dezelfde §15-suite tegen een echte,
#  wegwerpbare GEHOSTE test-DB (secret TEST_DATABASE_URL) die dichter bij de
#  productie-Supabase-config staat dan de CLI-stack. Zo surfacet drift die
#  optie A niet ziet: config die alleen in het Supabase-dashboard leeft
#  (auth-instellingen, extensies, storage-policies buiten de migraties).
#
#  Deze job draait op een schema en niet op push/PR. Een rode run blokkeert dus
#  geen pull request, maar is wel een rood operationeel signaal. Ontbrekende of
#  ongeldige DB-configuratie is fail-closed; de DB-laag mag hier nooit stil
#  worden overgeslagen.
#
#  De DB-laag draait hier NIET-destructief: de gedrag-suites seeden en rollen
#  terug (begin … rollback). Draai desondanks NOOIT tegen productie — het secret
#  moet naar een aparte, wegwerpbare test-branch-DB wijzen.
# ============================================================================
on:
  schedule:
    - cron: "0 3 * * *" # elke nacht 03:00 UTC
  workflow_dispatch: # handmatig aan te trappen

permissions:
  contents: read

concurrency:
  group: nightly-fidelity
  cancel-in-progress: false

jobs:
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Gehoste testdatabase verplicht
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/verify-nightly-fidelity-env.mjs

      - name: Dependencies installeren
        run: npm ci

      - name: Volledige §15-suite tegen de gehoste test-DB
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          XTENANT_REQUIRE_DB: "1"
        run: bash scripts/cross-tenant-ci.sh

      - name: Fidelitybewijs samenvatten
        run: |
          {
            echo "## Nightly fidelity"
            echo "- App-laag: voltooid"
            echo "- DB-laag: gestart en voltooid tegen de gehoste testdatabase"
          } >> "$GITHUB_STEP_SUMMARY"

  nightly-alert:
    name: Nightly fidelity melden
    needs: fidelity
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Incident openen, bijwerken of sluiten
        uses: actions/github-script@v7
        env:
          FIDELITY_RESULT: ${{ needs.fidelity.result }}
        with:
          script: |
            const marker = "<!-- nightly-fidelity-alert -->";
            const result = process.env.FIDELITY_RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );
            const details = [
              `- Run: [${context.runNumber}](${runUrl})`,
              `- Uitkomst: \`${result}\``,
              `- Event: \`${context.eventName}\``,
              `- Branch: \`${context.ref.replace("refs/heads/", "")}\``,
              `- Commit: [\`${context.sha.slice(0, 7)}\`](${commitUrl})`,
            ].join("\n");

            if (result === "success") {
              if (!incident) {
                core.info("Geen open nightly-fidelity-incident om te sluiten.");
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `Hersteld: de nightly fidelity-run is volledig groen.\n\n${details}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                state: "closed",
              });
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `Opnieuw rood: de nightly fidelity-run vereist opvolging.\n\n${details}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Nightly fidelity rood — opvolging vereist",
              body: [
                marker,
                "De gehoste cross-tenant fidelitycontrole is rood. Behandel dit als een operationeel incident; promoveer niet naar Productie als tenant-/RLS-gedrag de oorzaak is.",
                "",
                details,
                "",
                "Volg besluit 0194 en het centrale projectrunbook voor nightly-fidelity-opvolging.",
              ].join("\n"),
            });
