name: nightly-fidelity

# ============================================================================
#  Nightly fidelity — vaste Preview, strikt read-only (besluiten 0046/0194/0195).
# ----------------------------------------------------------------------------
#  De volledige muterende §15-suite blijft in rls-cross-tenant.yml op een
#  ephemere Supabase-stack draaien. Deze nachtelijke aanvulling gebruikt de
#  bestaande gehoste Preview uitsluitend voor catalogusfidelity: functies,
#  policies, RLS, publications en browser-EXECUTE-rechten.
#
#  De verbinding loopt via de bestaande least-privilege rol drift_lezer. De job
#  forceert read-only transacties, bewijst dat fondsdata en storage-objecten
#  onleesbaar zijn en voert nooit baseline, migraties, seeds of gedragswrites uit.
# ============================================================================
on:
  schedule:
    - cron: "0 3 * * *" # elke nacht 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fidelity
  cancel-in-progress: false

jobs:
  fidelity:
    name: Preview fidelity (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PREVIEW_REF: swviwoytzvaqypieqgji
      PRODUCTION_REF: aebwiufuegsiwhwpdrfb
      EXPECTED_PREVIEW_POOLER_HOST: aws-0-eu-north-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Read-only Preview-doel fail-closed opbouwen
        shell: bash
        env:
          DRIFT_DB_PASSWORD: ${{ secrets.DRIFT_DB_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "${DRIFT_DB_PASSWORD:-}" || {
            echo "::error title=Preview fidelity configuratiefout::preview_fidelity_config_missing" >&2
            exit 1
          }
          ENCODED_PASSWORD="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DRIFT_DB_PASSWORD"], safe=""))')"
          PREVIEW_DATABASE_URL="postgresql://drift_lezer.${EXPECTED_PREVIEW_REF}:${ENCODED_PASSWORD}@${EXPECTED_PREVIEW_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$ENCODED_PASSWORD"
          echo "::add-mask::$PREVIEW_DATABASE_URL"
          export PREVIEW_DATABASE_URL
          node scripts/verify-preview-fidelity-env.mjs
          echo "PREVIEW_DATABASE_URL=$PREVIEW_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Dependencies installeren
        run: npm ci

      - name: App-contracten uitvoeren
        run: npm run test:xtenant

      - name: Preview-catalogus read-only toetsen
        env:
          PGOPTIONS: -c default_transaction_read_only=on
        run: bash scripts/preview-fidelity-readonly.sh

      - name: Fidelitybewijs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-fidelity-bewijs
          path: |
            preview-fidelity-snapshot.txt
            preview-fidelity-diff.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Fidelitybewijs samenvatten
        run: |
          {
            echo "## Nightly Preview-fidelity"
            echo "- App-contracten: voltooid"
            echo "- Preview-catalogus: read-only gestart en voltooid"
            echo "- Gecontroleerd: functies, policies, RLS, publications en browser-EXECUTE-rechten"
            echo "- Fondsdata en storage-objecten: niet leesbaar"
            echo "- Baseline, migraties, seeds en muterende regressies: niet uitgevoerd"
          } >> "$GITHUB_STEP_SUMMARY"

  nightly-alert:
    name: Nightly fidelity melden
    needs: fidelity
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Incident openen, bijwerken of sluiten
        uses: actions/github-script@v7
        env:
          FIDELITY_RESULT: ${{ needs.fidelity.result }}
        with:
          script: |
            const marker = "<!-- nightly-fidelity-alert -->";
            const result = process.env.FIDELITY_RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );
            const details = [
              `- Run: [${context.runNumber}](${runUrl})`,
              `- Uitkomst: \`${result}\``,
              `- Event: \`${context.eventName}\``,
              `- Branch: \`${context.ref.replace("refs/heads/", "")}\``,
              `- Commit: [\`${context.sha.slice(0, 7)}\`](${commitUrl})`,
            ].join("\n");

            if (result === "success") {
              if (!incident) {
                core.info("Geen open nightly-fidelity-incident om te sluiten.");
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `Hersteld: de nightly Preview-fidelityrun is volledig groen.\n\n${details}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                state: "closed",
              });
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `Opnieuw rood: de nightly Preview-fidelityrun vereist opvolging.\n\n${details}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Nightly Preview-fidelity rood — opvolging vereist",
              body: [
                marker,
                "De read-only Preview-fidelitycontrole is rood. Behandel dit als een operationeel incident; promoveer niet naar Productie als schema-, policy- of RLS-drift de oorzaak is.",
                "",
                details,
                "",
                "Volg besluiten 0194/0195 en het centrale projectrunbook voor nightly-fidelity-opvolging.",
              ].join("\n"),
            });
