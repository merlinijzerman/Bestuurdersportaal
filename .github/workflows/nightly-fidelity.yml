name: nightly-fidelity

# ============================================================================
#  §15 cross-tenant suite — nightly FIDELITEIT (optie B, besluiten 0046/0194).
# ----------------------------------------------------------------------------
#  Fidelity-vangnet naast de ephemere CI-run (rls-cross-tenant.yml, optie A).
#  Draait dezelfde §15-suite tegen een echte,
#  wegwerpbare GEHOSTE test-DB (secret TEST_DATABASE_URL) die dichter bij de
#  productie-Supabase-config staat dan de CLI-stack. Zo surfacet drift die
#  optie A niet ziet: config die alleen in het Supabase-dashboard leeft
#  (auth-instellingen, extensies, storage-policies buiten de migraties).
#
#  Deze job draait op een schema en niet op push/PR. Een rode run blokkeert dus
#  geen pull request, maar is wel een rood operationeel signaal. Ontbrekende of
#  ongeldige DB-configuratie is fail-closed; de DB-laag mag hier nooit stil
#  worden overgeslagen.
#
#  De DB-laag draait hier NIET-destructief: de gedrag-suites seeden en rollen
#  terug (begin … rollback). Draai desondanks NOOIT tegen productie — het secret
#  moet naar een aparte, wegwerpbare test-branch-DB wijzen.
# ============================================================================
on:
  schedule:
    - cron: "0 3 * * *" # elke nacht 03:00 UTC
  workflow_dispatch: # handmatig aan te trappen

permissions:
  contents: read

concurrency:
  group: nightly-fidelity
  cancel-in-progress: false

jobs:
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Gehoste testdatabase verplicht
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/verify-nightly-fidelity-env.mjs

      - name: Dependencies installeren
        run: npm ci

      - name: Volledige §15-suite tegen de gehoste test-DB
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          XTENANT_REQUIRE_DB: "1"
        run: bash scripts/cross-tenant-ci.sh

      - name: Fidelitybewijs samenvatten
        run: |
          {
            echo "## Nightly fidelity"
            echo "- App-laag: voltooid"
            echo "- DB-laag: gestart en voltooid tegen de gehoste testdatabase"
          } >> "$GITHUB_STEP_SUMMARY"
