name: boundaries

# ============================================================================
#  Code-scheiding-gate (T9 fase 2, besluit 0052).
# ----------------------------------------------------------------------------
#  Twee statische borgingen, samen op elke push/PR:
#   1. ESLint boundary-gate (eslint.config.mjs) — dwingt de EENRICHTING af:
#      core ← platform, core/app-groepen ← platform/*. Een import over de grens
#      (bv. app/(dashboard) → @/platform/lib) → non-zero exit → deze job faalt.
#   2. Service-role-lek-check — de platform-service-role-laag (@/platform/lib)
#      mag nooit in tenant-/client-code lekken (TO §12 test 2).
#
#  GATE-STATUS STAAT NIET IN DIT BESTAND (W4, #96). Of deze job blokkeert is
#  uitsluitend te lezen uit de branch-protection-regel op `main`:
#      gh api repos/:owner/:repo/branches/main/protection \
#        --jq '.required_status_checks.contexts[]'
#  Een comment kan dat niet weten, en op 21-08-2026 hadden drie van de vier
#  gate-uitspraken in deze map het mis — alle drie onderschattend. Zet die
#  bewering hier dus niet terug; corrigeren lost één geval op, weglaten lost de
#  categorie op.
#
#  Wat WEL hier hoort: de job-`name` hieronder is de gepinde check-naam.
#  Hernoem hem niet zonder de branch-protection-regel mee te verzetten — dan
#  wordt de gate stil losgekoppeld én blijft elke PR hangen op een check die
#  nooit meldt.
#
#  Volgorde-eis die WEL blijft: zet een job pas als required aan nádat hij één
#  keer op `main` heeft gedraaid. Een required check waarvan de job op de
#  doelbranch onbekend is, blijft eeuwig pending en blokkeert ook de PR die hem
#  zou introduceren.
# ============================================================================
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundaries:
    # Gepinde check-naam voor branch protection "required status check".
    name: Code-scheiding (T9 core/platform-grens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: ESLint boundary-gate (core ↔ platform ↔ app)
        run: npm run lint:boundaries
      - name: Service-role-lek-check
        run: bash scripts/check-service-role-leak.sh

  migratie-mapindeling:
    # Gepinde check-naam voor branch protection "required status check".
    # Zelfde fasering als hierboven: aanzetten is één repo-admin-handeling.
    name: Mapindeling supabase/ (migraties vs rollbacks/seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapindeling-gate
        run: bash scripts/check-migratie-mapindeling.sh
