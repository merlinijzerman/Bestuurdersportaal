name: Supabase-back-upbewaking

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      synthetic_alert:
        description: Verstuur een veilige synthetische waarschuwing; raakt B2 en de productieback-up niet aan
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows:
      - Supabase-productieback-up
      - Platform-configuratie-inventaris
    types:
      - completed

permissions:
  contents: read
  actions: read

# Het goedgekeurde meldkanaal staat bewust in code en niet in een instelling in
# de UI: wijzigen vereist een PR en is daarmee reviewbaar en terugleesbaar
# (besluit 0185). Toegestaan: "github-native" (de rode workflowrun plus de
# GitHub-notificatie is het kanaal) of "webhook" (BACKUP_ALERT_WEBHOOK_URL).
env:
  ALERT_CHANNEL: github-native

jobs:
  synthetic-alert-delivery:
    name: Veilige synthetische alertdelivery
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.synthetic_alert }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-backup
    env:
      BACKUP_ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
      ALERT_CATEGORY: b2_evidence_invalid
      ALERT_SEVERITY: warning
      ALERT_REASON: synthetische watchdogtest
      ALERT_DETAILS: Deze veilige test raakt geen back-up, completion marker of B2-object aan.
      ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4.2.2

      - name: Node.js instellen
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Synthetische waarschuwing naar de webhook versturen
        if: env.ALERT_CHANNEL == 'webhook'
        env:
          ALERT_WEBHOOK_REQUIRED: "true"
        run: node scripts/send-backup-alert.mjs

      # Bij github-native is de rode run zelf het meldkanaal. De negatieve test
      # moet dus een rode run opleveren: alleen dan bewijst hij dat een echte
      # afwijking ook daadwerkelijk gemeld wordt. Er wordt niets aangeraakt —
      # geen back-up, geen completion marker, geen B2-object.
      - name: Synthetische mislukking zichtbaar maken via GitHub
        if: env.ALERT_CHANNEL == 'github-native'
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/send-backup-alert.mjs
          {
            echo "## Synthetische watchdogtest"
            echo "Deze run is met opzet rood. Hij bewijst dat een afwijking in de"
            echo "back-upbewaking een GitHub-notificatie oplevert. Er is geen"
            echo "back-up, completion marker of B2-object aangeraakt."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Synthetische watchdogtest::Opzettelijke testmelding; er is niets aangeraakt."
          exit 1

  alert-channel-configuration:
    name: Alertkanaalconfiguratie controleren
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production-backup
    env:
      BACKUP_ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
    steps:
      - name: Alertkanaal afzonderlijk controleren
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${ALERT_CHANNEL:-}" in
            github-native)
              # De rode run is het kanaal. Dat geldt alleen zolang iedere
              # inhoudelijke afwijking de run ook echt rood maakt.
              node scripts/verify-watchdog-fail-closed.mjs
              {
                echo "## Alertkanaal: GitHub-notificaties"
                echo "Een afwijking maakt de run rood; GitHub meldt dat aan de eigenaar"
                echo "van de workflow. Er is bewust geen extern meldkanaal ingericht."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            webhook)
              ;;
            *)
              echo "::error title=Alertkanaal onbekend::ALERT_CHANNEL is '${ALERT_CHANNEL:-leeg}'; verwacht github-native of webhook."
              exit 1
              ;;
          esac
          if [ -z "${BACKUP_ALERT_WEBHOOK_URL:-}" ]; then
            echo "::error title=Alertkanaal niet geconfigureerd::BACKUP_ALERT_WEBHOOK_URL ontbreekt. De B2-inhoudscontroles draaien in afzonderlijke jobs door."
            echo "## Alertkanaal niet geconfigureerd" >> "$GITHUB_STEP_SUMMARY"
            echo "De B2-inhoudscontroles draaien afzonderlijk door; deze configuratiefout betekent niet dat de productieback-up is mislukt." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Alertkanaal is geconfigureerd." >> "$GITHUB_STEP_SUMMARY"

  failure-alert:
    name: Alert bij mislukte workflow
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-backup
    env:
      BACKUP_ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
      ALERT_CATEGORY: backup_failed
      ALERT_SEVERITY: critical
      ALERT_REASON: ${{ format('workflow {0} mislukt', github.event.workflow_run.name) }}
      ALERT_DETAILS: ${{ format('Workflow {0} eindigde met status {1}.', github.event.workflow_run.name, github.event.workflow_run.conclusion) }}
      ALERT_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4.2.2

      - name: Node.js instellen
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Mislukte run alarmeren
        shell: bash
        env:
          ALERT_WEBHOOK_REQUIRED: ${{ env.ALERT_CHANNEL == 'webhook' && 'true' || 'false' }}
        run: |
          set -Eeuo pipefail
          if [ "${ALERT_CHANNEL:-}" = "webhook" ] && [ -z "${BACKUP_ALERT_WEBHOOK_URL:-}" ]; then
            echo "BACKUP_ALERT_WEBHOOK_URL ontbreekt; failure-alerting is niet geconfigureerd." >&2
            exit 1
          fi
          # Bij github-native heeft de mislukte bronworkflow zelf al een
          # notificatie opgeleverd; deze job legt de reden alleen vast.
          node scripts/send-backup-alert.mjs

  freshness-alert:
    name: Back-upouderdom en B2-compleetheid controleren
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backup
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_READONLY_APPLICATION_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_READONLY_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: eu-central-003
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "10"
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
      BACKUP_ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
      ALERT_CATEGORY: b2_evidence_invalid
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4.2.2

      - name: Node.js instellen
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: B2-instellingen controleren
        shell: bash
        run: |
          set -Eeuo pipefail
          missing_variables=""
          for variable in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_BUCKET_NAME B2_S3_ENDPOINT; do
            test -n "${!variable:-}" || missing_variables="${missing_variables}${missing_variables:+,}$variable"
          done
          if [ -n "$missing_variables" ]; then
            export ALERT_SEVERITY=critical
            export ALERT_REASON="B2-watchdogconfiguratie onvolledig"
            export ALERT_DETAILS="Ontbrekende watchdog-input(s): $missing_variables"
            node scripts/send-backup-alert.mjs
            exit 1
          fi

      - name: Laatste complete marker vinden
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS_LIST="$RUNNER_TEMP/status-list.json"
          aws s3api list-objects-v2 \
            --endpoint-url "$B2_S3_ENDPOINT" \
            --bucket "$B2_BUCKET_NAME" \
            --prefix backup-status/ \
            --output json > "$STATUS_LIST"
          LATEST_KEY="$(python3 - "$STATUS_LIST" <<'PY'
          import json
          import sys
          entries = json.load(open(sys.argv[1], encoding="utf-8")).get("Contents") or []
          candidates = [
              item for item in entries
              if item.get("Key", "").endswith(".json")
              and not item.get("Key", "").endswith(".sha256")
              and "/platform-inventory/" not in item.get("Key", "")
          ]
          candidates.sort(key=lambda item: item.get("LastModified", ""))
          print(candidates[-1]["Key"] if candidates else "")
          PY
          )"
          if [ -z "$LATEST_KEY" ]; then
            export ALERT_SEVERITY=critical
            export ALERT_REASON="geen complete Supabase-back-up gevonden"
            export ALERT_DETAILS="B2 bevat geen backup-status/*.json completion marker."
            node scripts/send-backup-alert.mjs
            exit 1
          fi
          echo "LATEST_KEY=$LATEST_KEY" >> "$GITHUB_ENV"

      - name: Completion marker en ouderdom controleren
        shell: bash
        run: |
          set -Eeuo pipefail
          MARKER="$RUNNER_TEMP/latest-backup.json"
          MARKER_HASH="$RUNNER_TEMP/latest-backup.json.sha256"
          aws s3api get-object --endpoint-url "$B2_S3_ENDPOINT" --bucket "$B2_BUCKET_NAME" --key "$LATEST_KEY" "$MARKER" >/dev/null || {
            export ALERT_SEVERITY=critical
            export ALERT_REASON="completion marker kan niet worden gelezen"
            export ALERT_DETAILS="B2-object $LATEST_KEY is niet leesbaar."
            node scripts/send-backup-alert.mjs
            exit 1
          }
          aws s3api get-object --endpoint-url "$B2_S3_ENDPOINT" --bucket "$B2_BUCKET_NAME" --key "$LATEST_KEY.sha256" "$MARKER_HASH" >/dev/null || {
            export ALERT_SEVERITY=critical
            export ALERT_REASON="checksum van completion marker ontbreekt"
            export ALERT_DETAILS="B2-object $LATEST_KEY.sha256 ontbreekt."
            node scripts/send-backup-alert.mjs
            exit 1
          }
          EXPECTED_HASH="$(awk '{print $1}' "$MARKER_HASH")"
          ACTUAL_HASH="$(sha256sum "$MARKER" | awk '{print $1}')"
          test "$EXPECTED_HASH" = "$ACTUAL_HASH" || {
            export ALERT_SEVERITY=critical
            export ALERT_REASON="checksum van completion marker wijkt af"
            export ALERT_DETAILS="B2-object $LATEST_KEY is gewijzigd of beschadigd."
            node scripts/send-backup-alert.mjs
            exit 1
          }

          CHECK_RESULT="$(python3 - "$MARKER" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          def parse_created_utc(value):
              try:
                  created = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  # Contract-v2 marker 2026-08-19T06-49-24Z was produced before
                  # created_utc was separated from the filesystem-safe timestamp.
                  created = datetime.strptime(value, "%Y-%m-%dT%H-%M-%SZ").replace(tzinfo=timezone.utc)
              if created.tzinfo is None:
                  raise ValueError("created_utc moet een tijdzone bevatten")
              return created.astimezone(timezone.utc)

          try:
              marker = json.load(open(sys.argv[1], encoding="utf-8"))
              created = parse_created_utc(marker["created_utc"])
              age_hours = (datetime.now(timezone.utc) - created).total_seconds() / 3600
              required = [
                  marker["database"]["archive_key"],
                  marker["database"]["checksum_key"],
                  marker["storage"]["archive_key"],
                  marker["storage"]["checksum_key"],
              ]
              database = marker.get("database", {})
              customizations = database.get("managed_customizations", {})
              expected_contents = {
                  "roles.sql",
                  "schema.sql",
                  "data.sql",
                  "managed-customizations.sql",
                  "managed-customizations-manifest.json",
                  "database-validation.json",
                  "metadata.txt",
              }
              expected_buckets = {"documenten", "documenten-quarantaine", "afschriften", "aqlab-audit"}
              coverage = marker.get("coverage", {})
              if marker.get("schema_version") != 2 or marker.get("status") != "complete":
                  print("critical|completion marker heeft geen status complete|" + str(marker.get("status")))
              elif marker.get("source_project") != "aebwiufuegsiwhwpdrfb":
                  print("critical|completion marker hoort bij onbekend bronproject|" + str(marker.get("source_project")))
              elif database.get("restore_contract_version") != 2 or set(database.get("contents", [])) != expected_contents:
                  print("critical|databasearchief heeft niet restorecontract 2|" + str(database.get("restore_contract_version")))
              elif (
                  customizations.get("schema_version") != 1
                  or len(customizations.get("sql_sha256", "")) != 64
                  or any(character not in "0123456789abcdef" for character in customizations.get("sql_sha256", ""))
              ):
                  print("critical|managed-customizations manifest is ongeldig|manifest of SQL-hash ontbreekt")
              elif set(marker.get("storage", {}).get("buckets", [])) != expected_buckets:
                  print("critical|Storage-dekking wijkt af van de vier afgesproken buckets|" + json.dumps(marker.get("storage", {}).get("buckets", [])))
              elif age_hours < -1:
                  print("critical|completion marker ligt in de toekomst|%.2f uur" % age_hours)
              elif age_hours > 48:
                  print("critical|laatste complete back-up is ouder dan 48 uur|%.2f uur" % age_hours)
              elif age_hours > 26:
                  print("warning|laatste complete back-up is ouder dan 26 uur|%.2f uur" % age_hours)
              elif not all(coverage.get(key) is True for key in ("auth_data", "storage_metadata", "physical_storage_objects")):
                  print("critical|back-upmanifest meldt onvolledige Auth/Storage-dekking|" + json.dumps(coverage, sort_keys=True))
              else:
                  print("ok|back-up is actueel en compleet|%.2f uur; objecten=%s" % (age_hours, marker["storage"]["object_count"]))
              with open(sys.argv[1] + ".keys", "w", encoding="utf-8") as output:
                  output.write("\n".join(required) + "\n")
          except Exception as error:
              print("critical|completion marker is ongeldig|%s" % type(error).__name__)
          PY
          )"
          STATUS="${CHECK_RESULT%%|*}"
          REST="${CHECK_RESULT#*|}"
          REASON="${REST%%|*}"
          DETAILS="${REST#*|}"
          if [ "$STATUS" = "ok" ]; then
            echo "Back-upwatchdog groen: $REASON · $DETAILS" >> "$GITHUB_STEP_SUMMARY"
          else
            export ALERT_SEVERITY="$STATUS"
            export ALERT_REASON="$REASON"
            export ALERT_DETAILS="$DETAILS"
            node scripts/send-backup-alert.mjs
            exit 1
          fi

      - name: Gerefereerde B2-objecten bestaan
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            aws s3api head-object --endpoint-url "$B2_S3_ENDPOINT" --bucket "$B2_BUCKET_NAME" --key "$key" >/dev/null || {
              export ALERT_SEVERITY=critical
              export ALERT_REASON="gerefereerd B2-object ontbreekt"
              export ALERT_DETAILS="B2-object $key ontbreekt volgens de laatste completion marker."
              node scripts/send-backup-alert.mjs
              exit 1
            }
          done < "$RUNNER_TEMP/latest-backup.json.keys"
          echo "Alle door de completion marker gerefereerde B2-objecten bestaan." >> "$GITHUB_STEP_SUMMARY"

  inventory-freshness-alert:
    name: Configuratie-inventaris en B2-compleetheid controleren
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backup
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_READONLY_APPLICATION_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_READONLY_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: eu-central-003
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "10"
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
      BACKUP_ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
      ALERT_CATEGORY: b2_evidence_invalid
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4.2.2

      - name: Node.js instellen
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Inventariswatchdog-inputs controleren
        shell: bash
        run: |
          set -Eeuo pipefail
          missing_variables=""
          for variable in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_BUCKET_NAME B2_S3_ENDPOINT; do
            test -n "${!variable:-}" || missing_variables="${missing_variables}${missing_variables:+,}$variable"
          done
          if [ -n "$missing_variables" ]; then
            export ALERT_SEVERITY=critical
            export ALERT_REASON="B2-inventariswatchdogconfiguratie onvolledig"
            export ALERT_DETAILS="Ontbrekende inventariswatchdog-input(s): $missing_variables"
            node scripts/send-backup-alert.mjs
            exit 1
          fi

      - name: Laatste configuratie-inventaris vinden
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS_LIST="$RUNNER_TEMP/inventory-status-list.json"
          aws s3api list-objects-v2 \
            --endpoint-url "$B2_S3_ENDPOINT" \
            --bucket "$B2_BUCKET_NAME" \
            --prefix backup-status/platform-inventory/ \
            --output json > "$STATUS_LIST"
          LATEST_KEY="$(python3 - "$STATUS_LIST" <<'PY'
          import json
          import sys
          entries = json.load(open(sys.argv[1], encoding="utf-8")).get("Contents") or []
          candidates = [
              item for item in entries
              if item.get("Key", "").endswith(".json") and not item.get("Key", "").endswith(".sha256")
          ]
          candidates.sort(key=lambda item: item.get("LastModified", ""))
          print(candidates[-1]["Key"] if candidates else "")
          PY
          )"
          if [ -z "$LATEST_KEY" ]; then
            export ALERT_SEVERITY=critical
            export ALERT_REASON="geen configuratie-inventaris gevonden"
            export ALERT_DETAILS="B2 bevat geen backup-status/platform-inventory/*.json completion marker."
            node scripts/send-backup-alert.mjs
            exit 1
          fi
          echo "LATEST_INVENTORY_KEY=$LATEST_KEY" >> "$GITHUB_ENV"

      - name: Inventarismarker, checksum en ouderdom controleren
        shell: bash
        run: |
          set -Eeuo pipefail
          MARKER="$RUNNER_TEMP/latest-platform-inventory.json"
          MARKER_HASH="$RUNNER_TEMP/latest-platform-inventory.json.sha256"
          aws s3api get-object --endpoint-url "$B2_S3_ENDPOINT" --bucket "$B2_BUCKET_NAME" --key "$LATEST_INVENTORY_KEY" "$MARKER" >/dev/null || {
            export ALERT_SEVERITY=critical
            export ALERT_REASON="configuratie-inventaris kan niet worden gelezen"
            export ALERT_DETAILS="B2-object $LATEST_INVENTORY_KEY is niet leesbaar."
            node scripts/send-backup-alert.mjs
            exit 1
          }
          aws s3api get-object --endpoint-url "$B2_S3_ENDPOINT" --bucket "$B2_BUCKET_NAME" --key "$LATEST_INVENTORY_KEY.sha256" "$MARKER_HASH" >/dev/null || {
            export ALERT_SEVERITY=critical
            export ALERT_REASON="checksum van configuratie-inventaris ontbreekt"
            export ALERT_DETAILS="B2-object $LATEST_INVENTORY_KEY.sha256 ontbreekt."
            node scripts/send-backup-alert.mjs
            exit 1
          }
          EXPECTED_HASH="$(awk '{print $1}' "$MARKER_HASH")"
          ACTUAL_HASH="$(sha256sum "$MARKER" | awk '{print $1}')"
          test "$EXPECTED_HASH" = "$ACTUAL_HASH" || {
            export ALERT_SEVERITY=critical
            export ALERT_REASON="checksum van configuratie-inventaris wijkt af"
            export ALERT_DETAILS="B2-object $LATEST_INVENTORY_KEY is gewijzigd of beschadigd."
            node scripts/send-backup-alert.mjs
            exit 1
          }

          CHECK_RESULT="$(python3 - "$MARKER" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          try:
              marker = json.load(open(sys.argv[1], encoding="utf-8"))
              created = datetime.fromisoformat(marker["created_utc"].replace("Z", "+00:00"))
              age_days = (datetime.now(timezone.utc) - created).total_seconds() / 86400
              required = (
                  "supabase_project_config",
                  "supabase_auth_config",
                  "supabase_storage_config",
                  "supabase_database_config",
                  "vercel_project_config",
                  "vercel_environment_variable_names",
              )
              coverage = marker.get("coverage", {})
              missing = [key for key in required if coverage.get(key) is not True]
              if marker.get("status") != "complete":
                  print("critical|configuratie-inventaris is niet compleet|" + str(marker.get("status")))
              elif age_days < -0.05:
                  print("critical|configuratie-inventaris ligt in de toekomst|%.2f dagen" % age_days)
              elif missing:
                  print("critical|configuratie-inventaris mist verplichte dekking|" + ",".join(missing))
              elif age_days > 14:
                  print("critical|configuratie-inventaris is ouder dan 14 dagen|%.2f dagen" % age_days)
              elif age_days > 8:
                  print("warning|configuratie-inventaris is ouder dan 8 dagen|%.2f dagen" % age_days)
              else:
                  print("ok|configuratie-inventaris actueel|%.2f dagen" % age_days)
          except Exception as error:
              print("critical|configuratie-inventaris is ongeldig|%s" % type(error).__name__)
          PY
          )"
          STATUS="${CHECK_RESULT%%|*}"
          REST="${CHECK_RESULT#*|}"
          REASON="${REST%%|*}"
          DETAILS="${REST#*|}"
          if [ "$STATUS" = "ok" ]; then
            echo "Configuratie-inventariswatchdog groen: $REASON · $DETAILS" >> "$GITHUB_STEP_SUMMARY"
          else
            export ALERT_SEVERITY="$STATUS"
            export ALERT_REASON="$REASON"
            export ALERT_DETAILS="$DETAILS"
            node scripts/send-backup-alert.mjs
            exit 1
          fi

      - name: Gerefereerde inventarisobjecten bestaan
        shell: bash
        run: |
          set -Eeuo pipefail
          INVENTORY_KEY="$(python3 - "$RUNNER_TEMP/latest-platform-inventory.json" <<'PY'
          import json
          import sys
          marker = json.load(open(sys.argv[1], encoding="utf-8"))
          print(marker["inventory_key"])
          PY
          )"
          for key in "$INVENTORY_KEY" "$INVENTORY_KEY.sha256"; do
            aws s3api head-object --endpoint-url "$B2_S3_ENDPOINT" --bucket "$B2_BUCKET_NAME" --key "$key" >/dev/null || {
              export ALERT_SEVERITY=critical
              export ALERT_REASON="gerefereerd configuratie-inventarisobject ontbreekt"
              export ALERT_DETAILS="B2-object $key ontbreekt volgens de laatste inventarismarker."
              node scripts/send-backup-alert.mjs
              exit 1
            }
          done
