name: security-baseline

# Eén stabiele status voor de Sprint 1-securityondergrens, zodat branch
# protection één check kan selecteren i.p.v. zeven losse workflowstappen.
#
#  GATE-STATUS STAAT NIET IN DIT BESTAND (W4, #96). Of deze job blokkeert is
#  uitsluitend te lezen uit de branch-protection-regel op `main`:
#      gh api repos/:owner/:repo/branches/main/protection \
#        --jq '.required_status_checks.contexts[]'
#  Een comment kan dat niet weten, en op 21-08-2026 hadden drie van de vier
#  gate-uitspraken in deze map het mis — alle drie onderschattend. Zet die
#  bewering hier dus niet terug; corrigeren lost één geval op, weglaten lost de
#  categorie op.
#
#  Wat WEL hier hoort: de job-`name` hieronder is de gepinde check-naam.
#  Hernoem hem niet zonder de branch-protection-regel mee te verzetten — dan
#  wordt de gate stil losgekoppeld én blijft elke PR hangen op een check die
#  nooit meldt.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-baseline:
    # Naam gepind voor branch protection; niet wijzigen zonder de regel mee te
    # wijzigen.
    name: Security baseline (Sprint 1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node opzetten
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Committed-secretsscan
        run: bash scripts/check-committed-secrets.sh

      - name: React-, Hooks- en Next-baselinegate
        run: |
          set -o pipefail
          npm run lint:quality:check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Snelle contracttests
        run: |
          npm run test:seed-guard
          npm run test:nightly-fidelity-contract
          npm run test:e2e:guard
          npm run test:lint-quality-contract
          npm run test:ci-ownership-contract

      - name: Vitest-workflowcontract
        run: npm run test:coverage-contract

      - name: Vitest coveragebaseline
        id: vitest-coverage
        run: npm run test:coverage

      - name: Coverage samenvatten
        if: ${{ always() }}
        run: node scripts/render-vitest-coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Coverageartifact bewaren
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Malwarescanner-tests
        run: |
          npm ci --prefix scanner
          npm test --prefix scanner

      - name: Productiebuild
        env:
          # Alleen build-time vormwaarden. Geen echte omgeving, sleutel of
          # netwerktoegang; voorkomt dat statische login-prerendering faalt
          # voordat Next.js de applicatiecode heeft kunnen verifiëren.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

      # WP5-5b. De service-role-lekcheck in de boundaries-workflow toetst de BRON;
      # deze stap toetst wat er feitelijk in de gebouwde bundle staat — de enige
      # plek waar een pen-tester kijkt. Moet ná de build draaien en met dezelfde anon-key,
      # want die waarde is de positieve sentinel: wordt hij niet in .next/static
      # teruggevonden, dan heeft de scan niets gelezen en faalt de stap.
      - name: Buildoutput-sleutelcheck
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: node scripts/check-bundle-secrets.mjs

      - name: Fast-PR-samenvatting
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ## Fast PR-eigenaarschap

          | Laag | Primaire workflow |
          |---|---|
          | secrets, unit/componentcoverage, contract, scanner, qualitylint, buildsecurity | security-baseline |
          | types, sanity, app-cross-tenant | g2-evidence |
          | boundaries en service-role-lek | boundaries |
          | kleur en fondsthema | lint-colors |

          Coverageartifact: `vitest-coverage` (14 dagen).
          EOF
