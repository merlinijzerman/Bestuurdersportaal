# === CONTENT_HASH_CONVENTION ===
content_hash_convention:
  hash_algorithm: sha256
  hash_input: canonical_text zonder runtime-metadata (dus zonder fixture_id, versie, content_hash zelf)
  line_ending_normalisatie: LF (\n); trailing whitespace per regel verwijderd; bestand eindigt met exact
    één newline
  encoding: UTF-8
  canonical_text_bron: de 'Volledige synthetische tekst' van de fixture in AQLAB-HORIZON-FIXTURES-v0.2.md
  version_bump_rule: elke inhoudelijke wijziging van canonical_text -> fixture.version + 1; de oude versie
    blijft bestaan zodat historische runs reproduceerbaar blijven
  seeding_requirement: content_hash MOET gevuld zijn (geen '<sha256-placeholder>') voordat een fixture
    geseed mag worden
# === PRE_SEED_VALIDATION ===
pre_seed_validation:
  automated_checks:
  - yaml_valid
  - testcases_count == 33
  - all_required_source_ids_exist_as_fixture
  - 'all_excluded_source_ids_exist_or_intentional (uitzondering: HORIZON-NIET-BESTAAND-XXX voor SEC-05)'
  - all_expected_facts_resolve (fixture_id + fact_id bestaan)
  - all_checks_exist_in_check_registry
  - all_review_required_have_human_review_check_or_review_instruction
  - all_consistency_required_have_iterations_and_pass_rule
  - no_real_fund_data
  - all_fixtures_synthetic_true
  - content_hash_filled (faalt zolang placeholders bestaan)
  - linked_testcases_bidirectional (testcase-fixture verwijzingen sluitend)
  human_validation_required:
  - avg_scope_confirmed voor SEC-06 (FIX-19)
  - juridische/compliance-duiding bevestigd voor BS-06, BV-04, SEC-04
  - judge_json_schemas definitief
  - expected_facts/forbidden_claims inhoudelijk bevestigd door Product Owner AI + Risk & Compliance
  status: structureel seed-ready; inhoudelijk/technisch nog pre-seed-validatie nodig
