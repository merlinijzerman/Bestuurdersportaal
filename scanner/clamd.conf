# ============================================================================
#  scanner/clamd.conf — configuratie van de scannerdaemon.
# ----------------------------------------------------------------------------
#  Twee dingen zijn hier veiligheidskritisch:
#
#  1. ALERT-OPTIES. ClamAV documenteert dat een bestand boven MaxFileSize
#     "will be skipped and assumed clean". Zonder de Alert*-opties hieronder is
#     elke limiet dus een fail-open. Ze zetten die stilzwijgende "schoon" om in
#     een expliciete melding, die de scannerlaag als `policy_blocked` vertaalt.
#
#  2. LIMIETEN RUIM BOVEN DE UPLOADGRENS. De applicatie weigert al boven 25 MB
#     (MAX_BESTAND_BYTES). De limieten hier staan bewust hoger, zodat een
#     legitiem document er nooit tegenaan loopt — raakt een bestand ze tóch,
#     dan is dat per definitie verdacht en geen randgeval.
#
#  clamd valideert deze configuratie bij het opstarten en weigert te starten bij
#  een onbekende sleutel. Het starten van clamd in de image-build is daarmee
#  meteen de verificatie dat elke gebruikte optie in deze ClamAV-versie bestaat.
# ============================================================================

# ── Transport ───────────────────────────────────────────────────────────────
# Uitsluitend een unix-socket: de daemon is niet over het netwerk bereikbaar,
# ook niet vanuit de container zelf. Geen TCPSocket, bewust.
LocalSocket /tmp/clamd/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
Foreground yes

# ── Gelijktijdigheid ────────────────────────────────────────────────────────
# Fluid Compute kan meerdere requests binnen één instance uitvoeren. De
# applicatielaag houdt het op één scan tegelijk; deze waarden zijn de tweede
# lijn, zodat een fout in die semafoor niet meteen het geheugen opblaast.
MaxThreads 2
MaxQueue 4
MaxConnectionQueueLength 8

# ── Scanlimieten ────────────────────────────────────────────────────────────
# StreamMaxLength geldt voor INSTREAM en is de harde bovengrens van wat de
# daemon accepteert; de applicatielaag kapt al eerder af op 64 MB.
StreamMaxLength 64M
#
# MaxFileSize/MaxScanSize zijn BEWUST krap gezet, en dat is gemeten werk.
# Eerst stonden ze op 64M/256M — ruim boven de 25 MB-uploadgrens. Een OOXML met
# een ingesloten entry van 70 MB kwam daarmee als `OK` terug: de limieten waren
# zo los dat AlertExceedsMax nooit afging voor iets wat de applicatie zou
# accepteren. De optie was daarmee decoratief.
#
# Met deze waarden is ze een echte achtervang: alles wat de 25 MB-uploadgrens
# haalt, blijft er ruim onder, terwijl een ongebruikelijk grote of sterk
# uitpakkende bijlage nu wél `Heuristics.Limits.Exceeded` oplevert — wat de
# scannerlaag als `policy_blocked` vertaalt.
#
# NB: de eerste linie tegen decompressiebommen blijft beoordeelDecompressie()
# in core/lib/bestand-validatie.ts (MAX_UITGEPAKT_BYTES + MAX_COMPRESSIE_RATIO),
# die vóór de scan draait. Deze grenzen zijn de tweede linie, niet de enige.
MaxFileSize 32M
MaxScanSize 100M
MaxRecursion 12
MaxFiles 2000
MaxScanTime 60000
MaxEmbeddedPE 16M
MaxHTMLNormalize 16M
MaxHTMLNoTags 8M
MaxScriptNormalize 8M
MaxZipTypeRcg 4M
MaxPartitions 64
MaxIconsPE 200

# ── Alert-opties: hier wordt fail-open fail-closed ──────────────────────────
# Een bestand dat een limiet raakt, versleuteld is of structureel kapot is,
# mag nooit stilzwijgend als schoon terugkomen.
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
AlertPartitionIntersection yes

# OLE2-macro's worden bewust NIET als alert behandeld: macrodragende formaten
# (DOCM/XLSM/PPTM) zijn al door de uploadvalidatie uitgesloten, en een alert op
# elke macro zou hier alleen ruis opleveren.
AlertOLE2Macros no

# ── Ontleding ───────────────────────────────────────────────────────────────
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes
ScanMail no
ScanHTML yes

# ── Bedrijfsvoering ─────────────────────────────────────────────────────────
# Bij geheugengebrek stoppen in plaats van doormodderen: een half werkende
# scanner die "schoon" teruggeeft is gevaarlijker dan een scanner die omvalt.
ExitOnOOM yes
LogTime yes
LogClean no
# Geen LogFile: alles naar stdout, zodat de platformlogging het oppakt en er
# geen scanverslag op de containerschijf achterblijft.
LogSyslog no
Debug no
