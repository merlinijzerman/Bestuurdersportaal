# ============================================================================
#  Supabase CLI-config voor de ephemere test-DB (increment T5, besluit 0046).
# ----------------------------------------------------------------------------
#  Deze config voedt UITSLUITEND de wegwerpbare CI-test-DB (optie A): de runner
#  boot hiermee de stack (Postgres + auth + storage) en past daarna de migraties
#  via psql toe (scripts/testdb-apply-migrations.sh — de repo-migratienamen
#  volgen niet het 14-cijferige CLI-tijdstempelformaat, dus we omzeilen de
#  CLI-migratietracker bewust; zie besluit 0046 → Gevolgen).
#
#  Versie-pin (besluit 0046, validatiepunt 1): de schone Preview-omgeving draait
#  sinds 2026-08-14 op Postgres major 17. `major_version = 17` houdt de
#  wegwerp-test-DB representatief voor de baseline waartegen Sprint 1 sluit.
#  Productie draait OOK op major 17 — gemeten op 2026-08-19 in het dashboard van
#  project aebwiufuegsiwhwpdrfb: Postgres 17.6.1.111 (Auth 2.195.0, PostgREST
#  14.5). De eerdere aanname "mogelijk nog op major 14" was onjuist en is hier
#  vervangen; onderbouwing in 02 Architectuur/ONTWERPNOTITIE-MIGRATIEPROCES-v2.1
#  §1. Wat resteert is een MINOR-verschil: er staat een upgrade naar 17.6.1.155
#  klaar. Voer die uit vóór een geautomatiseerde productiemigratie, niet
#  ertussendoor.
#
#  Dit bestand is GEEN productieconfig — de app deployt via Vercel op het
#  gehoste Supabase-project, niet via deze CLI-stack.
# ============================================================================

project_id = "bestuurdersportaal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Pin op de Preview-baseline (besluit 0046, validatiepunt 1). De baseline gebruikt
# onder meer de PG17-privilege MAINTAIN en moet daarom op dezelfde major draaien.
major_version = 17

[db.pooler]
enabled = false

[storage]
# Vereist voor T7 (storage-download-isolatie): de bucket `documenten` + de
# storage.objects-policies worden door de migraties opgebouwd.
enabled = true
file_size_limit = "50MiB"

[auth]
# Vereist voor de self-seeding suites (T3 DEEL 2, T4, T6/T7): auth.users +
# de trigger maak_profiel() maken de synthetische tenant-profielen.
enabled = true
site_url = "http://localhost:3000"

[studio]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
